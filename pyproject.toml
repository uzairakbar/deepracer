[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deepracer"
version = "0.1.0"
description = "A Gymnasium environment for the AWS DeepRacer simulator"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Uzair Akbar", email = "uzairakbar025@gmail.com" }]
dependencies = [
    "numpy",
    "matplotlib",
    "gymnasium",
    "pyzmq",
    "msgpack",
    "msgpack_numpy",
    "loguru",
    "docker",   # Docker/Podman(-socket) backend
    "pyyaml",   # packaged track_config parsing
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/uzairakbar/deepracer"
Repository = "https://github.com/uzairakbar/deepracer"

# Distribution only includes the importable `deepracer` client/
[tool.setuptools.packages.find]
where = ["client"]
include = ["deepracer*"]

[tool.setuptools.package-data]
"deepracer.defaults" = [
    "agent_params.json",
    "environment_params.yaml",
    "reward_function.py",
    "tracks.txt",
]
