[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deepracer"
version = "0.1.0"
description = "A Gymnasium wrapper for the AWS DeepRacer simulator"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Uzair Akbar", email = "uzairakbar025@gmail.com" }]
dependencies = [
    "numpy",
    "matplotlib",
    "gymnasium",
    "pyzmq",
    "msgpack",
    "msgpack_numpy",
    "loguru",
    "docker",   # Docker/Podman(-socket) backend
    "pyyaml",   # packaged track_config parsing
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15",
    "mypy>=1.14",
    "pytest>=8",
    "pytest-cov",
    "pre-commit>=4",
    "types-PyYAML",
    "bump-my-version",
]
docs = [
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10",
]

[project.urls]
Homepage = "https://uzairakbar.github.com/deepracer/"
Repository = "https://github.com/uzairakbar/deepracer"
Documentation = "https://uzairakbar.github.com/deepracer/"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# put project root in sys.path to resolve `from tests.conftest import ...`
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["service"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["client/deepracer"]
ignore_missing_imports = true

# Distribution only includes the importable `deepracer` client/
[tool.setuptools.packages.find]
where = ["client"]
include = ["deepracer*"]

[tool.setuptools.package-data]
"deepracer.defaults" = [
    "agent_params.json",
    "environment_params.yaml",
    "reward_function.py",
    "tracks.txt",
]
