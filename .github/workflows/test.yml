name: test

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # the client installs from client/ only; the service submodule is not needed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # editable so coverage paths map back to client/deepracer/ source
        run: python -m pip install -e ".[dev]"
      - name: Pytest
        # docker integration tests auto-skip without a usable daemon
        run: pytest --cov=deepracer --cov-report=xml
