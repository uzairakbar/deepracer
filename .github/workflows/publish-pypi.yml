name: publish to PyPI

# Build the `deepracer` distribution and publish it to PyPI whenever a GitHub
# Release is published. Uses PyPI Trusted Publishing (OIDC) — no API token
# secret required.
#
# One-time PyPI setup (https://docs.pypi.org/trusted-publishers/):
#   On PyPI → project `deepracer` → Publishing, add a GitHub trusted publisher:
#     owner:       uzairakbar
#     repository:  deepracer
#     workflow:    publish-pypi.yml
#     environment: pypi
# (For the very first upload, add it as a "pending" publisher before the project exists.)

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # the package builds from client/ only; the service submodule is not needed

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check distribution metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
